version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      # One PR a week for all major bumps; split it if one breaks.
      npm-major:
        patterns: ["*"]
        update-types: ["major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
